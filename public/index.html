<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Reader</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Toolbar -->
    <header class="toolbar">
      <div class="toolbar-left">
        <button class="icon-btn hidden" id="btnBack" title="返回" aria-label="返回">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <button class="icon-btn hidden" id="btnFocusExit" title="退出聚焦模式" aria-label="退出聚焦模式">
          ✕
        </button>
      </div>
      <div class="toolbar-center">
        <span class="logo">澄阅</span>
      </div>
      <div class="toolbar-right">
        <div class="font-controls hidden" id="fontControls" aria-label="字号调节">
          <button class="font-btn" id="fontSmall" data-size="small" title="小字号 16px">小</button>
          <button class="font-btn" id="fontMedium" data-size="medium" title="中字号 20px">中</button>
          <button class="font-btn" id="fontLarge" data-size="large" title="大字号 24px">大</button>
        </div>
        <button class="icon-btn hidden" id="btnFocus" title="聚焦模式" aria-label="聚焦模式">
          <span class="theme-icon">⛶</span>
        </button>
        <button class="icon-btn hidden" id="btnLinks" title="提取链接" aria-label="提取链接">
          <span class="theme-icon">🔗</span>
        </button>
        <button class="icon-btn" id="btnTheme" title="切换为深色模式" aria-label="切换主题">
          <span class="theme-icon" id="themeIcon">🌙</span>
        </button>
        <button class="icon-btn hidden" id="btnExport" title="导出 Markdown" aria-label="导出">
          <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
        </button>
      </div>
    </header>

    <!-- Main -->
    <main class="main">
      <!-- Welcome -->
      <section class="view active" id="viewWelcome">
        <div class="welcome-inner">
          <p class="slogan">
            予文字以清净，<br /><span class="slogan-second">还阅读以澄澈</span>
          </p>
          <div class="slogan-divider"></div>
          <input
            class="url-input"
            id="urlInput"
            type="url"
            placeholder="粘贴文章链接到这里..."
            autocomplete="off"
          />
          <button class="start-btn" id="btnStart">开始阅读</button>
          <div class="error-msg" id="errorMsg"></div>
          <div class="section">
            <div class="section-header">
              <h2>⭐ 收藏</h2>
              <button id="btnClearFavorites" class="btn btn-sm" disabled>清空</button>
            </div>
            <div id="favoritesList" class="history-list"></div>
          </div>
          <div class="bookmark-tip">
            <p>将下方按钮拖拽至浏览器书签栏，即可在任意页面一键发送到澄阅阅读</p>
            <a class="bookmark-link" id="bookmarklet" href="#">📖 澄阅 · 阅读此页</a>
            <script>
              (function () {
                var link = document.getElementById('bookmarklet');
                if (!link) return;
                var origin = window.location.origin;
                link.href =
                  "javascript:(function(){window.open('" +
                  origin +
                  "/?url='+encodeURIComponent(location.href),'_blank');})();";
              })();
            </script>
            <code class="bookmark-code" id="bookmarkCode" title="点击复制书签代码"></code>
            <p class="bookmark-code-hint">或点击上方代码复制到书签</p>
          </div>
        </div>
      </section>

      <!-- Reading -->
      <section class="view" id="viewReading">
        <div class="loading-overlay" id="loadingOverlay">
          <div class="spinner"></div>
          <span id="loadingText">正在提取…</span>
        </div>
        <div class="reading-inner is-hidden" id="readingInner">
          <div class="article-title-row">
            <h1 class="article-title" id="articleTitle"></h1>
            <span id="btnFavorite" class="favorite-btn" title="收藏">☆</span>
          </div>
          <div class="article-meta">
            <span id="metaWordCount"></span>
            <span id="metaReadTime"></span>
          </div>
          <div class="article-content" id="articleContent"></div>
        </div>
      </section>
    </main>

    <!-- History -->
    <footer class="history-bar">
      <span class="history-label">历史</span>
      <div class="history-list" id="historyList">
        <span class="history-empty">暂无记录</span>
      </div>
      <button class="clear-btn" id="btnClear" disabled>清空</button>
    </footer>

    <!-- Link modal -->
    <div class="modal-overlay hidden" id="linkModal" role="dialog" aria-modal="true" aria-labelledby="linkModalTitle">
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title" id="linkModalTitle">正文链接</h2>
          <button class="modal-close" id="btnCloseLinks" title="关闭" aria-label="关闭">✕</button>
        </div>
        <div class="modal-body" id="linkModalBody"></div>
      </div>
    </div>

    <div id="markToolbar" class="mark-toolbar hidden">
      <button id="btnMark" class="btn btn-sm">🖍 标记</button>
    </div>

    <div id="annotationModal" class="annotation-modal hidden">
      <div class="modal-content">
        <h3>编辑批注</h3>
        <textarea id="annotationInput" rows="3" placeholder="输入批注..."></textarea>
        <div class="modal-actions">
          <button id="btnSaveAnnotation" class="btn">保存</button>
          <button id="btnDeleteMark" class="btn btn-danger">删除标记</button>
          <button id="btnCancelAnnotation" class="btn">取消</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
